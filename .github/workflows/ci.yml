name: Task Tracker Full CI


on:
  push:
    branches: [ master ]
  
  
  pull_request:
    branches: [ master ]


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'


      - name: Restore dependencies
        run: dotnet restore


      - name: Build project
        run: dotnet build --no-restore --configuration Release
      
      
      # Модульні + інтеграційні + database tests
      - name: Run .NET Tests
        run: dotnet test --no-build --configuration Release --verbosity normal
      
      
      # Встановлення k6
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          
          
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | \
          sudo tee /etc/apt/sources.list.d/k6.list
          
          
          sudo apt-get update
          sudo apt-get install k6
      
      
      # Запуск API
      - name: Start API
        run: |
          dotnet run --project FinProjectTaskTracker/FinProjectTaskTracker.csproj --configuration Release &
          sleep 10
      
      
      # k6 performance tests
      - name: Run k6 Load Tests
        run: k6 run FinProjectTaskTracker.Tests/Performance/load-test.js

      - name: Run k6 Stress Tests
        run: k6 run FinProjectTaskTracker.Tests/Performance/stress-test.js

